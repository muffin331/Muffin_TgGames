<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Muffin Game - Muffin Fly</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #1a0f2e; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; text-align: center; }
        h1 { color: #ff9d00; text-transform: uppercase; }
        .balance-card { background: #2d1b4e; border-radius: 20px; padding: 15px; margin: 20px 0; border: 2px solid rgba(255, 157, 0, 0.3); }
        .balance-value { font-size: 32px; font-weight: bold; color: #ff9d00; }
        .muffin-rocket { font-size: 80px; animation: fly 2.5s ease-in-out infinite; margin: 20px 0; }
        @keyframes fly { 0%, 100% { transform: translateY(0px) rotate(-5deg); } 50% { transform: translateY(-20px) rotate(5deg); } }
        .btn { background: linear-gradient(135deg, #e056fd, #686de0); color: white; border: none; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h1>🧁 MUFFIN FLY</h1>
    <div class="balance-card">
        <div>Твои монеты</div>
        <div class="balance-value" id="balance">100 MUFFIN</div>
    </div>
    <div class="muffin-rocket">🧁🚀</div>
    <button class="btn" onclick="launchMuffin()">🚀 Запустить Muffin Fly (+10)</button>
</div>
<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    let balance = 100;
    function launchMuffin() {
        balance += 10;
        document.getElementById('balance').innerText = balance + ' MUFFIN';
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    }
</script>
</body>
</html>
